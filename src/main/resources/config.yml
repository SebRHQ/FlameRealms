# FlameRealms configuration
#
# NOTE: pricing.yml, war.yml, and other domain-specific configuration files
# arrive in later milestones. Only the bootstrap database/async settings
# live here for now.

database:
  host: "localhost"
  port: 3306
  database: "flamerealms"
  username: "flamerealms"
  password: "CHANGE_ME"
  pool-size: 10
  # How long (in milliseconds) to wait for a connection from the pool before
  # giving up. Default matches HikariCP's own default (30000).
  connection-timeout-ms: 30000
  # Minimum number of idle connections HikariCP tries to maintain in the
  # pool. Default matches HikariCP's own default of being equal to
  # pool-size.
  minimum-idle: 10
  # Maximum lifetime (in milliseconds) of a connection in the pool before it
  # is retired. Default matches HikariCP's own default (1800000, i.e. 30
  # minutes).
  max-lifetime-ms: 1800000
  # How long (in milliseconds) HikariCP waits for a connection to be
  # validated as alive. Default matches HikariCP's own default (5000).
  validation-timeout-ms: 5000

async:
  executor-thread-pool-size: 4

visualization:
  # Particle traced along a previewed chunk's boundary (ClaimVisualizationService).
  # Must be a valid org.bukkit.Particle name.
  particle: FLAME
  # How long (in seconds) a chunk-boundary preview keeps pulsing before it
  # self-cancels.
  preview-duration-seconds: 5
  # How many chunks out from a player's own chunk the /realm map-style
  # territory grid (TerritoryMapService) covers, in every direction.
  map-radius-chunks: 8
